<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172321" />
    <title>Handbean — 离线</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f3ef; color: #1a1815; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #ded9d1; border-radius: 18px; background: #fff; box-shadow: 0 18px 60px rgba(26, 24, 21, 0.08); }
      .mark { width: 52px; height: 52px; margin-bottom: 24px; border-radius: 14px; background: #172321; display: grid; place-items: center; color: #f4ead7; font-size: 28px; font-weight: 700; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #69645d; font-size: 14px; line-height: 1.65; }
      .english { margin-top: 10px; font-size: 12px; }
      a { display: inline-flex; margin-top: 24px; min-height: 42px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 10px; background: #172321; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #111714; color: #f4f0e9; }
        main { border-color: #34403b; background: #17201c; box-shadow: none; }
        p { color: #aaa49a; }
        .mark, a { background: #f4ead7; color: #172321; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◐</div>
      <h1>Handbean 暂时无法连接</h1>
      <p>请确认网络和 Handbean 服务已恢复，然后重试。此离线页不保存或显示任何对话与工作区内容。</p>
      <p class="english">Handbean is offline. Check the network and server, then try again.</p>
      <a href="/">重试连接 · Retry</a>
    </main>
  </body>
</html>
