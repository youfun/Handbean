android.useAndroidX=true
# Cap heap so Gradle + Kotlin daemons fit a ~8 GiB orb. 4g OOMs a 3.8 GiB box
# and still crowds an 8 GiB one once the Kotlin daemon starts.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
